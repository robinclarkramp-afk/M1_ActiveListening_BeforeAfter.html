<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Writing Makeover</title><style>body{margin:0;background:#f4f5f9;font-family:system-ui,Arial,sans-serif;color:#17213b;display:grid;place-items:center;min-height:100vh}.stage{width:min(680px,92vw);background:white;border-radius:24px;padding:34px;box-shadow:0 15px 45px #1d2c521c}.eyebrow{font-size:13px;letter-spacing:.14em;font-weight:800;color:#626c84}.title{font-size:clamp(25px,4vw,36px);margin:8px 0 26px}.panel{border-radius:18px;background:#f1f3f8;padding:28px;min-height:130px;display:flex;flex-direction:column;justify-content:center;transition:background .4s}.tag{font-weight:800;font-size:13px;letter-spacing:.1em;color:#7a4b35}.sentence{font-size:clamp(21px,3vw,29px);line-height:1.4;margin:14px 0 0}.highlight{background:#ffe5a2;border-radius:5px;padding:0 3px}.tip{min-height:55px;margin:20px 0;color:#3b4761;font-size:17px;line-height:1.5}.controls{display:flex;align-items:center;justify-content:space-between;gap:10px}.buttons{display:flex;gap:10px}button{border:0;border-radius:12px;padding:12px 17px;font-size:15px;font-weight:700;cursor:pointer;background:#243d79;color:white}button.secondary{background:#e7eaf2;color:#243d79}.dots{display:flex;gap:7px}.dot{height:9px;width:9px;border-radius:50%;background:#c5cad6}.dot.active{background:#243d79}@media(prefers-reduced-motion:no-preference){.panel{animation:fade .35s ease}@keyframes fade{from{opacity:.35;transform:translateY(7px)}to{opacity:1;transform:none}}}</style></head><body><main class="stage"><div class="eyebrow">THE 20-SECOND WRITING MAKEOVER</div><h1 class="title">Don't just name it. Explain it.</h1><div class="panel" id="panel" aria-live="polite"><div class="tag" id="tag">BEFORE</div><p class="sentence" id="sentence">I organize my schoolwork.</p></div><div class="tip" id="tip">This names a behavior—but doesn't show how or why it helps.</div><div class="controls"><div class="dots" id="dots" aria-label="Slide 1 of 3"></div><div class="buttons"><button class="secondary" id="replay">↺ Replay</button><button id="next">Next →</button></div></div></main><script>const steps=[{tag:'BEFORE',sentence:'I organize my schoolwork.',tip:'This names a behavior—but doesn’t show how or why it helps.',bg:'#f1f3f8',color:'#7a4b35'},{tag:'AFTER',sentence:'I organize my schoolwork by <span class="highlight">listing assignments in order of their deadlines.</span> This helps me <span class="highlight">prioritize tasks and complete my work on time.</span>',tip:'Notice the two improvements: HOW the behavior works and WHY it helps.',bg:'#eef6f0',color:'#216947'},{tag:'YOUR TURN',sentence:'Name the behavior. <span class="highlight">Show how.</span> <span class="highlight">Explain why.</span>',tip:'Use this same thinking for your two active listening behaviors in Section D.',bg:'#edf1fc',color:'#243d79'}];let i=0;let timer;const panel=document.getElementById('panel'),tag=document.getElementById('tag'),sentence=document.getElementById('sentence'),tip=document.getElementById('tip'),dots=document.getElementById('dots'),next=document.getElementById('next');function show(n){i=n;const s=steps[i];tag.textContent=s.tag;tag.style.color=s.color;sentence.innerHTML=s.sentence;tip.textContent=s.tip;panel.style.background=s.bg;panel.style.animation='none';void panel.offsetWidth;panel.style.animation='';dots.innerHTML=steps.map((_,j)=>'<span class="dot '+(j===i?'active':'')+'"></span>').join('');dots.setAttribute('aria-label',`Slide ${i+1} of 3`);next.textContent=i===2?'Start again ↺':'Next →'}function advance(){show((i+1)%3)}function restartAuto(){clearInterval(timer);timer=setInterval(advance,5500)}next.onclick=()=>{advance();restartAuto()};document.getElementById('replay').onclick=()=>{show(0);restartAuto()};show(0);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)restartAuto();</script></body></html>
